<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Palette from web/app/globals.css (light theme). */
      :root {
        --ground: #f6f7f9;
        --panel: #ffffff;
        --ink: #14171c;
        --muted: #5b6472;
        --line: #e2e5ea;
        --accent: #0b57d0;
        --good: #137a3c;
        --good-bg: #e6f4ea;
        --warn: #8a5a00;
        --warn-bg: #fff4dc;
        --bad: #b3261e;
        --bad-bg: #fce8e6;
        --chip: #eef1f5;
        --font-display: "Inter", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="4.2"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="4.2" data-duration="6.6"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="10.8" data-duration="4.2"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="15" data-duration="3.9"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="18.9" data-duration="6.1"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="music" data-start="0" data-duration="25" data-track-index="10" data-volume="0.3"
        data-fade-in="0.8" data-fade-out="2.2" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <!-- "Charged" lands -->
      <audio id="sfx-charged" data-start="1.5" data-duration="0.18" data-track-index="11" data-volume="0.6"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <!-- beat-locked: 8.74s, the "Taken" click -->
      <audio id="sfx-taken" data-start="8.74" data-duration="0.05" data-track-index="12" data-volume="0.7"
        src="assets/sfx/interface/click_003.ogg"></audio>
      <!-- strict -> express chip switch -->
      <audio id="sfx-switch" data-start="12.6" data-duration="0.5" data-track-index="13" data-volume="0.55"
        src="assets/sfx/interface/switch_007.ogg"></audio>
      <!-- beat-locked: 17.47s, the deny row -->
      <audio id="sfx-deny" data-start="17.45" data-duration="0.15" data-track-index="14" data-volume="0.6"
        src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <!-- beat-locked: 22.93s, the wordmark -->
      <audio id="sfx-logo" data-start="22.9" data-duration="1.48" data-track-index="15" data-volume="0.55"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

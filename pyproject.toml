[project]
name = "proofpay"
version = "0.1.0"
description = "Trust-scored pay-on-verify checkout on PayPal"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.11",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

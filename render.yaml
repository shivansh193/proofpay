services:
  - type: web
    name: proofpay
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: PROOFPAY_PAYPAL
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: SEED_DEMO_HOLDS
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://proofpay-6jk0.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
